<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Visualizer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <script>
        // Configure Tailwind for dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-chart-pie text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Smart Expense Visualizer</h1>
                    </div>
                    <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Total Spent Card -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-blue-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">Total Spent</p>
                            <p class="text-3xl font-bold text-gray-900 dark:text-white mt-2">₱<span id="totalSpent">0.00</span></p>
                        </div>
                        <div class="bg-blue-100 dark:bg-blue-900 rounded-lg p-3">
                            <i class="fas fa-wallet text-blue-600 dark:text-blue-400 text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- Highest Category Card -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-purple-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">Highest Category</p>
                            <p class="text-3xl font-bold text-gray-900 dark:text-white mt-2" id="highestCategory">—</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">₱<span id="highestAmount">0.00</span></p>
                        </div>
                        <div class="bg-purple-100 dark:bg-purple-900 rounded-lg p-3">
                            <i class="fas fa-chart-bar text-purple-600 dark:text-purple-400 text-xl"></i>
                        </div>
                    </div>
                </div>

                <!-- Transaction Count Card -->
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-green-500">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">Transactions</p>
                            <p class="text-3xl font-bold text-gray-900 dark:text-white mt-2" id="transactionCount">0</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Total expenses</p>
                        </div>
                        <div class="bg-green-100 dark:bg-green-900 rounded-lg p-3">
                            <i class="fas fa-list text-green-600 dark:text-green-400 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Grid: Form + Chart -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                <!-- Add Expense Form -->
                <div class="lg:col-span-1">
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-2">
                            <i class="fas fa-plus-circle text-blue-500"></i>
                            Add Expense
                        </h2>
                        
                        <form id="expenseForm" class="space-y-4">
                            <!-- Description Field -->
                            <div>
                                <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Description
                                </label>
                                <input 
                                    type="text" 
                                    id="description" 
                                    placeholder="e.g., AWS Hosting"
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                                    required
                                />
                            </div>

                            <!-- Amount Field -->
                            <div>
                                <label for="amount" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Amount (₱)
                                </label>
                                <input 
                                    type="number" 
                                    id="amount" 
                                    step="0.01"
                                    min="0"
                                    placeholder="0.00"
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                                    required
                                />
                            </div>

                            <!-- Category Dropdown -->
                            <div>
                                <label for="category" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Category
                                </label>
                                <select 
                                    id="category"
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                                    required
                                >
                                    <option value="">-- Select Category --</option>
                                    <option value="Hosting">Hosting</option>
                                    <option value="Tools">Tools</option>
                                    <option value="Software">Software</option>
                                    <option value="Courses">Courses</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <!-- Add Custom Category -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Add New Category
                                </label>
                                <div class="flex gap-2">
                                    <input 
                                        type="text" 
                                        id="newCategory" 
                                        placeholder="e.g., Marketing"
                                        class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                                    />
                                    <button 
                                        type="button"
                                        id="addCategoryBtn"
                                        class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200"
                                    >
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                                <p id="categoryMessage" class="text-xs text-gray-500 dark:text-gray-400 mt-1 hidden"></p>
                            </div>

                            <!-- Date Field -->
                            <div>
                                <label for="date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Date
                                </label>
                                <input 
                                    type="date" 
                                    id="date"
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                                    required
                                />
                            </div>

                            <!-- Submit Button -->
                            <button 
                                type="submit"
                                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2"
                            >
                                <i class="fas fa-plus"></i>
                                Add Expense
                            </button>
                        </form>

                        <!-- Error Message -->
                        <div id="errorMessage" class="mt-4 p-3 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200 rounded-lg hidden flex items-center gap-2">
                            <i class="fas fa-exclamation-circle"></i>
                            <span id="errorText"></span>
                        </div>
                    </div>
                </div>

                <!-- Pie Chart -->
                <div class="lg:col-span-2">
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-2">
                            <i class="fas fa-chart-pie text-purple-500"></i>
                            Spending by Category
                        </h2>
                        
                        <div class="relative w-full h-80">
                            <canvas id="expenseChart"></canvas>
                        </div>
                        
                        <p id="noDataMessage" class="text-center text-gray-500 dark:text-gray-400 mt-4 hidden">
                            No expense data yet. Add an expense to see the chart.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-2">
                    <i class="fas fa-history text-green-500"></i>
                    Recent Transactions
                </h2>
                
                <div class="overflow-x-auto table-scroll">
                    <table class="w-full text-sm">
                        <thead class="border-b border-gray-200 dark:border-gray-700">
                            <tr class="text-left text-gray-600 dark:text-gray-400 font-semibold">
                                <th id="th-date" class="pb-3 px-4 cursor-pointer select-none" onclick="setSort('date')">Date</th>
                                <th id="th-description" class="pb-3 px-4 cursor-pointer select-none" onclick="setSort('description')">Description</th>
                                <th id="th-category" class="pb-3 px-4 cursor-pointer select-none" onclick="setSort('category')">Category</th>
                                <th id="th-amount" class="pb-3 px-4 cursor-pointer select-none" onclick="setSort('amount')">Amount</th>
                                <th class="pb-3 px-4">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr class="text-center text-gray-500 dark:text-gray-400">
                                <td colspan="5" class="py-8">
                                    <i class="fas fa-inbox text-2xl mb-2"></i>
                                    <p>No transactions yet</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Clear All Button -->
                <div class="mt-6 flex justify-end">
                    <button id="clearAllBtn" class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 hidden flex items-center gap-2">
                        <i class="fas fa-trash"></i>
                        Clear All
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
