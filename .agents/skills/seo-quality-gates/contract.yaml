name: seo-quality-gates
version: "1.1"
purpose: >-
  Review SEO output before publication and block fabricated, spammy,
  unverifiable, or risky changes.

required_inputs:
  - proposed_change
  - target_page_or_files
  - evidence_artifacts

optional_inputs:
  - rendered_page_text
  - raw_html
  - json_ld
  - diff
  - source_documents
  - rollback_plan

outputs:
  required:
    - overall_verdict
    - gates
    - blocking_gates
    - warnings
    - required_fixes
  report_schema: ../../shared/schemas/quality_gate.schema.json

gates:
  - fabricated_data
  - fake_or_ineligible_review_rating_markup
  - faqpage_abuse
  - keyword_stuffing
  - thin_doorway_or_scaled_content
  - ai_slop_people_first_failure
  - cannibalization
  - cloaking_or_hidden_text
  - risky_technical_edits
  - over_automation_no_human_review

evidence_types:
  - measured
  - inferred
  - user_provided
  - unavailable

blocking_conditions:
  - invented_rating_review_price_availability_author_stat_or_citation
  - structured_data_not_visible_or_verifiable
  - faqpage_markup_for_non_visible_or_promotional_questions
  - doorway_page_or_near_duplicate_location_keyword_page
  - hidden_text_or_cloaking
  - risky_technical_edit_without_human_approval_or_rollback_plan
  - mass_publishing_without_review

human_approval_required_for:
  - robots_txt_changes
  - noindex_or_x_robots_tag_changes
  - canonical_changes
  - redirect_changes
  - hreflang_changes
  - sitemap_bulk_changes
  - sitewide_schema_changes

hard_rules:
  - Any BLOCK means DO_NOT_SHIP.
  - WARN means proceed only after explicit review.
  - Missing evidence for a risky claim is a block, not a pass.
  - Keep warnings distinct from blockers.
